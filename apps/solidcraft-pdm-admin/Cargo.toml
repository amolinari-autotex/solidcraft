[package]
name = "solidcraft-pdm-admin"
description = "Local native SolidCraft PDM server administration console"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
solidcraft-pdm = { path = "../solidcraft-pdm" }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "x11", "wayland"] }
egui.workspace = true
rfd.workspace = true
image.workspace = true
pollster.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }
keyring = { version = "3.6", default-features = false, features = ["apple-native", "windows-native", "async-secret-service", "async-io", "crypto-rust"] }
